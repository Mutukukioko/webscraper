{% extends 'scraper/base.html' %}

{% block title %}Email List{% endblock %}

{% block content %}
    <h1>Email List</h1>
    <p><a href="{% url 'email_list' %}?export=csv">Download as CSV</a></p>
    <ul>
        {% for email in emails %}
            <li>{{ email.email }} (from {{ email.url }})</li>
        {% empty %}
            <li>No emails found yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
